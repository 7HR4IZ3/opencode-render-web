services:
  opencode:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "4097:4097"
    environment:
      PORT: "${PORT:-3000}"
      API_PORT: "${API_PORT:-4097}"
      OPENCODE_WORKDIR: "${OPENCODE_WORKDIR:-/workspace}"
    volumes:
      - opencode-data:/var/lib/opencode
      - ./workspace:/workspace

volumes:
  opencode-data:
