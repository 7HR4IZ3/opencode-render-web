services:
  - type: web
    name: opencode-render-web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /site.webmanifest
    autoDeployTrigger: commit
    envVars:
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_AUTH_B64
        sync: false
      - key: OPENCODE_DB
        value: /var/lib/opencode/opencode.db
      - key: OPENCODE_LITESTREAM_ENABLED
        value: "1"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_SESSION_TOKEN
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PREFIX
        value: opencode
      - key: API_PORT
        value: "4097"
