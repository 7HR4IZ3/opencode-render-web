services:
  - type: web
    name: opencode-render-web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /site.webmanifest
    autoDeployTrigger: commit
    envVars:
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_MCP_URL
        value: https://mcp.vercel.com
      - key: GITLAB_TOKEN
        sync: false
      - key: GITLAB_URL
        value: https://gitlab.com
      - key: GITLAB_MCP_URL
        value: https://gitlab.com/api/v4/mcp
      - key: TERMINAL_USERNAME
        sync: false
      - key: TERMINAL_PASSWORD
        sync: false
      - key: TERMINAL_PORT
        value: "4098"
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_AUTH_B64
        sync: false
      - key: OPENCODE_DB
        value: /var/lib/opencode/opencode.db
      - key: OPENCODE_LITESTREAM_ENABLED
        value: "1"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_SESSION_TOKEN
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PREFIX
        value: opencode
      - key: R2_SYNC_ENABLED
        value: "1"
      - key: R2_SYNC_PREFIX
        value: workspace
      - key: R2_SYNC_INTERVAL_MS
        value: "5000"
      - key: R2_SYNC_DEBOUNCE_MS
        value: "750"
      - key: R2_SYNC_CONFLICT
        value: skip
      - key: R2_SYNC_IGNORE
        value: .r2-sync,.opencode,.git,node_modules
      - key: API_PORT
        value: "4097"
      - key: PROXY_ALLOWED_PORTS
        value: ""
